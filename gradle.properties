# Project-wide Gradle settings (Optimized for 8GB RAM)

# 1. Limit Gradle JVM Memory (1024MB prevents PC freezing)
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC -Dfile.encoding=UTF-8

# 2. Disable heavy parallel threads to save CPU & RAM
org.gradle.parallel=false

# 3. Build & Configuration Caching for Faster Build
org.gradle.configuration-cache=true
org.gradle.caching=true

# 4. Kotlin settings
kotlin.code.style=official